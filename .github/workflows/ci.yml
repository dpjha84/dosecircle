name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      # Core rules (scheduling, double-dose guard, escalation, plans) + the Android app
      - run: gradle :core:check :app:lintDebug :app:assembleDebug :app:bundleRelease --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dosecircle-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: dosecircle-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error